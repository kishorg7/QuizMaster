<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizMaster - Quiz</title>
</head>

<body>

    <header>
        <h1>QuizMaster</h1>
    </header>

    <main>

        <section>
    <h2>Quiz</h2>

    <p>Answer each question to test your knowledge.</p>

    <div id="quiz-progress">

    <p id="question-number">Question 1 of 10</p>

    <p id="score">Score: 0</p>

</div>
    </section>

        <section>
    <h2>Question</h2>

    <div id="question-container" aria-live="polite">
    <p id="question">Question will appear here</p>
</div>

<div id="options" aria-label="Answer options">

    <button type="button" class="option">Option 1</button>
    <button type="button" class="option">Option 2</button>
    <button type="button" class="option">Option 3</button>
    <button type="button" class="option">Option 4</button>

    </div>
    </section>

      <section>
    <h2>Quiz Navigation</h2>

    <div id="quiz-controls" aria-label="Quiz navigation controls">
    <button type="button" id="next-btn" aria-label="Go to the next question">
        Next
    </button>
</div>
</section>

    </main>

</body>

</html>
