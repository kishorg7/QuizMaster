<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizMaster - Quiz</title>
</head>

<body>

    <header>
        <h1>QuizMaster</h1>
    </header>

    <main>

        <section>
    <h2>Quiz</h2>

    <p>Answer each question to test your knowledge.</p>

    <div>
        <p id="question-number">Question 1 of 10</p>
        <p id="score">Score: 0</p>
    </div>
    </section>

        <section>
    <h2>Question</h2>

    <div id="question-container">
        <p id="question">Question will appear here</p>
    </div>

    <div id="options">
        <!-- Answer options will appear here -->
    </div>
    </section>

        <section>
            <button id="next-btn">Next</button>
        </section>

    </main>

</body>

</html>
